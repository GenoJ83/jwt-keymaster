[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jwt-keymaster"
version = "0.1.0"
description = "JWT verification, claims debugging, and JWKS management CLI"
authors = [{ name = "Geno Joshua" }]
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
